spring.application.name=virtualLaboratory

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Virtual_Laboratory?createDatabaseIfNotExist=true}
spring.datasource.username=db_username

spring.datasource.password=abcsd
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
#app.jwt.secret=${JWT_SECRET}
app.jwt.secret=your_very_long_random_secret_key_at_least_32_bytes

