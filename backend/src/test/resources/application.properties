spring.datasource.url=jdbc:h2:mem:virtual_laboratory_test;MODE=MySQL;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:test-jwt-secret-test-jwt-secret-test-jwt-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.judge0.base-url=${JUDGE0_BASE_URL:http://localhost:2358}
app.judge0.auth-token=${JUDGE0_AUTH_TOKEN:}
app.judge0.max-source-code-bytes=65536
app.judge0.max-stdin-bytes=16384
app.judge0.cpu-time-limit=5.0
app.judge0.memory-limit=128000
app.judge0.wall-time-limit=10.0
app.judge0.stack-limit=64000
app.judge0.max-processes=60
app.judge0.rate-limit.enabled=false
app.judge0.rate-limit.requests-per-minute=10
