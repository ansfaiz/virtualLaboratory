name: Frontend CI
on:
  push:
    branches:
      - frontend-phase
  pull_request:
    branches:
      - main
jobs:
  build:
    name: build and test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: set up Node.js
        uses: actions/setup-node@v4
        with:   
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Build frontend
        run: npm run build
      