
name: Backend CI

on:
  push:
    branches:
      - backend-phase
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, test and validate Docker image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: ./mvnw -B test

      - name: Build Docker image
        run: docker build -t vls-backend:latest .
